<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Fizzy</title>
    <meta name="description" content="Login to The Fizzy - Premium Kombucha Brewery">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap CSS -->
    <link id="bootstrap-link" rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="auth-controls">
        <button id="theme-toggle" class="control-btn" title="Toggle Dark/Light Mode"><i class="bi bi-sun"></i></button>
        <button id="rtl-toggle" class="control-btn" title="Toggle LTR/RTL"><span class="rtl-text">LTR</span></button>
    </div>

    <!-- Login Section -->
    <section class="section-padding" style="padding-top: 120px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="glass-card auth-card text-center">
                        <!-- Logo and Brand -->
                        <div class="mb-4">
                            <a href="index.html"
                                class="navbar-brand d-inline-flex align-items-center justify-content-center">

                                <span class="fs-3">The Fizzy</span>
                            </a>
                        </div>

                        <h2 class="mb-2">Welcome Back</h2>
                        <p class="opacity-75 mb-4">Login to access your account</p>

                        <!-- Login Form -->
                        <form class="text-start mb-4">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="your@email.com"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="password-field-container">
                                    <input type="password" class="form-control" id="password"
                                        placeholder="Enter your password" required>
                                    <span class="password-toggle" onclick="togglePassword('password', this)">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="text-accent text-decoration-none">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn btn-accent w-100 mb-3">Login</button>
                        </form>

                        <!-- Social Login -->
                        <div class="mb-4">
                            <p class="opacity-75 mb-3">Or login with</p>
                            <div class="d-flex gap-3 justify-content-center">
                                <button class="btn btn-outline-light flex-fill">
                                    <i class="bi bi-google me-2"></i>Google
                                </button>
                                <button class="btn btn-outline-light flex-fill">
                                    <i class="bi bi-facebook me-2"></i>Facebook
                                </button>
                                <button class="btn btn-outline-light flex-fill">
                                    <i class="bi bi-apple me-2"></i>Apple
                                </button>
                            </div>
                        </div>

                        <!-- Sign Up Link -->
                        <p class="mb-0">
                            Don't have an account?
                            <a href="signup.html" class="text-accent text-decoration-none fw-bold">Sign Up</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS + Popper JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
