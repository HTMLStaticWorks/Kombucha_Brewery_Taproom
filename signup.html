<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | The Fizzy</title>
    <meta name="description" content="Sign up for The Fizzy - Premium Kombucha Brewery">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap CSS -->
    <link id="bootstrap-link" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                
                <span>The Fizzy</span>
            </a>

            <div class="theme-controls d-lg-none ms-auto me-3">
                <button id="rtl-toggle-mob" class="control-btn" aria-label="Toggle RTL"><span
                        class="rtl-text">LTR</span></button>
            </div>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav m-inline-start-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Home</a>
                        <ul class="dropdown-menu bg-dark border-secondary">
                            <li><a class="dropdown-item text-white" href="index.html">Home 1</a></li>
                            <li><a class="dropdown-item text-white" href="home-2.html">Home 2</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="flavors.html">Flavors</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Pricing</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>

                <div class="d-flex align-items-center ms-3">
                    <a href="login.html" class="btn btn-outline-accent btn-sm me-3">Login</a>
                    <div class="theme-controls d-none d-lg-flex">
                        <button id="theme-toggle" class="control-btn" title="Toggle Dark/Light Mode"><i
                                class="bi bi-sun"></i></button>
                        <button id="rtl-toggle" class="control-btn" title="Toggle LTR/RTL"><span
                                class="rtl-text">LTR</span></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sign Up Section -->
    <section class="section-padding" style="padding-top: 120px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="glass-card text-center">
                        <!-- Logo and Brand -->
                        <div class="mb-4">
                            <a href="index.html" class="navbar-brand d-inline-flex align-items-center justify-content-center">
                                
                                <span class="fs-3">The Fizzy</span>
                            </a>
                        </div>

                        <h2 class="mb-2">Join The Fizzy</h2>
                        <p class="opacity-75 mb-4">Create your account to get started</p>

                        <!-- Sign Up Form -->
                        <form class="text-start mb-4">
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white" id="fullName" 
                                       placeholder="John Doe" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control bg-dark border-secondary text-white" id="email" 
                                       placeholder="your@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control bg-dark border-secondary text-white" id="password" 
                                       placeholder="Create a strong password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control bg-dark border-secondary text-white" id="confirmPassword" 
                                       placeholder="Confirm your password" required>
                            </div>
                            
                            <!-- Terms and Conditions -->
                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terms" required>
                                    <label class="form-check-label" for="terms">
                                        I agree to the <a href="#" class="text-accent text-decoration-none">Terms and Conditions</a> 
                                        and <a href="#" class="text-accent text-decoration-none">Privacy Policy</a>
                                    </label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-accent w-100 mb-3">Sign Up</button>
                        </form>

                        <!-- Social Sign Up -->
                        <div class="mb-4">
                            <p class="opacity-75 mb-3">Or sign up with</p>
                            <div class="d-flex gap-3 justify-content-center">
                                <button class="btn btn-outline-light flex-fill">
                                    <i class="bi bi-google me-2"></i>Google
                                </button>
                                <button class="btn btn-outline-light flex-fill">
                                    <i class="bi bi-facebook me-2"></i>Facebook
                                </button>
                                <button class="btn btn-outline-light flex-fill">
                                    <i class="bi bi-twitter-x me-2"></i>Twitter
                                </button>
                            </div>
                        </div>

                        <!-- Login Link -->
                        <p class="mb-0">
                            Already have an account? 
                            <a href="login.html" class="text-accent text-decoration-none fw-bold">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS + Popper JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
